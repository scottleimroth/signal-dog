name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg version and microphone inputs
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -1
          case "$RUNNER_OS" in
            macOS)   ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | tail -8 || true ;;
            Windows) ffmpeg -hide_banner -list_devices true -f dshow -i dummy 2>&1 | tail -8 || true ;;
          esac
      - name: Diagnose (macOS) - the audio device alone, and the plugin's filters on a file
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "== the device alone, 6 s, no filters"
          ffmpeg -hide_banner -f avfoundation -i ":0" -t 6 -f null - 2>&1 | grep -E "Stream|time=|speed=" | tail -4 || true
          echo "== the plugin's 64 filters on 30 s of noise from a file, as fast as possible"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.01:sample_rate=48000:duration=30" -ac 2 /tmp/noise.wav
          python -B - <<'PY'
          import subprocess, sys, time
          sys.path.insert(0, "tools")
          import replay
          replay.load()
          from signal_dog import graph
          t = time.time()
          p = subprocess.run(graph.command("file:/tmp/noise.wav", realtime=False), capture_output=True)
          dt = time.time() - t
          print("30 s of sound took %.1f s: %.0f times faster than real time; frames %d" % (dt, 30 / dt, len(p.stdout) // graph.FRAME_BYTES))
          PY
      - name: Diagnose (macOS) - live rate with input queue variants
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python -B - <<'PY'
          import subprocess, sys, time
          sys.path.insert(0, "tools")
          import replay
          replay.load()
          from signal_dog import graph
          base = graph.command("default")
          i = base.index("-f")
          variants = {
              "as shipped": base,
              "thread_queue_size 1024": base[:i] + ["-thread_queue_size", "1024"] + base[i:],
              "thread_queue_size 4096": base[:i] + ["-thread_queue_size", "4096"] + base[i:],
          }
          for name, cmd in variants.items():
              cmd = [c if c != "error" else "warning" for c in cmd]
              p = subprocess.Popen(cmd, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              got, start, first = 0, time.time(), None
              while time.time() - start < 10.0:
                  chunk = p.stdout.read(graph.FRAME_BYTES * 10)
                  if not chunk:
                      break
                  first = first or time.time()
                  got += len(chunk)
              end = time.time(); p.kill(); p.wait(5)
              rate = (got // graph.FRAME_BYTES) / max(end - (first or end), 1e-6)
              err = p.stderr.read().decode("utf-8", "replace").strip().splitlines()
              print("%-24s %.0f frames a second; warnings: %s" % (name, rate, " | ".join(sorted(set(l[-90:] for l in err))[:4])))
          PY
      - name: Live microphone input (macOS), 5 seconds through the plugin's own ffmpeg command
        if: runner.os == 'macOS'
        run: |
          python -B - <<'PY'
          import subprocess, sys, time
          sys.path.insert(0, "tools")
          import replay
          replay.load()
          from signal_dog import graph
          cmd = graph.command("default")
          print("input:", graph.microphone_input("default"))
          p = subprocess.Popen(cmd, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=graph.environment())
          got, start, first = 0, time.time(), None
          while time.time() - start < 12.0:
              chunk = p.stdout.read(graph.FRAME_BYTES * 10)
              if not chunk:
                  break
              if first is None:
                  first = time.time()
              got += len(chunk)
          end = time.time()
          p.kill(); p.wait(5)
          frames = got // graph.FRAME_BYTES
          rate = frames / max(end - first, 1e-6) if first else 0.0
          print("first reading after %.1f s; then %d frames in %.1f s = %.0f a second (100 expected)" % (
              (first or end) - start, frames, end - (first or end), rate))
          if rate < 80:
              print(p.stderr.read().decode("utf-8", "replace")[-600:])
              sys.exit(1)
          PY
      - name: Unit tests (standard Python only)
        working-directory: tests
        run: python -B -m unittest discover -s . -v
