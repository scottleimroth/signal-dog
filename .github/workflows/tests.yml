name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg version and microphone inputs
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -1
          case "$RUNNER_OS" in
            macOS)   ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | tail -8 || true ;;
            Windows) ffmpeg -hide_banner -list_devices true -f dshow -i dummy 2>&1 | tail -8 || true ;;
          esac
      - name: Unit tests (standard Python only)
        working-directory: tests
        run: python -B -m unittest discover -s . -v
